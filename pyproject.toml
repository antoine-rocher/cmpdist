[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cmpdist"
version = "0.1.0"
description = "Conway-Maxwell-Poisson sampling: over- and under-dispersed count distributions, parameterised by their mean"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Antoine Rocher", email = "antoinerocher01370@gmail.com" }]
keywords = [
    "conway-maxwell-poisson", "cmp", "count data", "overdispersion",
    "underdispersion", "sampling", "statistics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "numpy>=1.20",
    "numba>=0.55",
    "scipy>=1.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/antoine-rocher/cmpdist"
Source = "https://github.com/antoine-rocher/cmpdist"
Issues = "https://github.com/antoine-rocher/cmpdist/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
